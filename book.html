<body data-page="book">

<header class="site">
  <div class="header-top">
    <a class="brand" href="/">
      <img src="assets/logo.png" alt="شعار أبو سليمة للسياحة">
      <span class="brand-text">
        <strong>أبو سليمة للسياحة</strong>
        <span>#ليزدادوا_إيمانا</span>
      </span>
    </a>
    <a class="call-now" href="tel:+201129329312">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span class="txt">اتصل بنا الآن</span>
    </a>
  </div>
  <nav class="pills" aria-label="التنقل السريع">
    <a href="/">الرئيسية</a>
    <a href="/hajj">باقات الحج</a>
    <a href="/umrah">عروض العمرة</a>
    <a href="/#contact">تواصل معنا</a>
  </nav>
</header>

<main class="form-page">
  <div class="wrap">
    <div class="form-card">
      <h1>طلب حجز</h1>
      <p class="lead">املأ البيانات وسنفتح واتساب برسالة جاهزة لفريق خدمة العملاء.</p>
      <form id="reservationForm">
        <div class="form-group">
          <label for="name">الاسم بالكامل</label>
          <input id="name" name="name" type="text" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="phone">رقم الموبايل</label>
          <input id="phone" name="phone" type="tel" required inputmode="tel" placeholder="01xxxxxxxxx" autocomplete="tel">
        </div>
        <div class="form-group">
          <label for="service">مهتم بـ</label>
          <select id="service" name="service" required>
            <option value="">اختر</option>
            <option value="hajj">حج</option>
            <option value="umrah">عمرة</option>
          </select>
        </div>
        <div class="form-group">
          <label for="package">الباقة / الرحلة</label>
          <input id="package" name="package" type="text" required>
        </div>
        <div class="form-group">
          <label for="travellers">عدد المسافرين</label>
          <input id="travellers" name="travellers" type="number" min="1" max="50" value="1" required>
        </div>
        <div class="form-group">
          <label for="departure">موعد السفر المفضل</label>
          <input id="departure" name="departure" type="text" placeholder="مثال: 22 سبتمبر">
        </div>
        <div class="form-group">
          <label for="city">المدينة</label>
          <input id="city" name="city" type="text" required>
        </div>
        <div class="form-group">
          <label for="contactMethod">طريقة التواصل المفضلة</label>
          <select id="contactMethod" name="contactMethod" required>
            <option value="واتساب">واتساب</option>
            <option value="اتصال هاتفي">اتصال هاتفي</option>
          </select>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">إرسال عبر واتساب</button>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div>أبو سليمة للسياحة — Abo Slima Tours &copy; 2026</div>
  <div class="hashtag">#ليزدادوا_إيمانا</div>
</footer>

</a>
